name: Refresh KBO results after games

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes from KST 15:00 through 02:50 the next day.
    # The gate below performs the actual game-date/start-time check.
    - cron: "*/10 6-17 * * *"

concurrency:
  group: kbo-result-refresh
  cancel-in-progress: true

jobs:
  refresh-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check result refresh window
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/check_kbo_result_refresh.py

      - name: Install result sync dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Refresh KBO results in Supabase
        if: steps.gate.outputs.should_run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESULT_SYNC_ONLY: "1"
          SYNC_TARGET_DATE: ${{ steps.gate.outputs.target_date }}
        run: python scripts/sync_kbo_schedule.py
