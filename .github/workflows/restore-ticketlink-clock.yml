name: Restore Ticketlink Clock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - run: python scripts/restore_ticketlink_clock.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html eoheung-member-logo-patch.js
          git commit -m "Restore working Ticketlink clock and remove duplicate RTT status" || exit 0
          git push
