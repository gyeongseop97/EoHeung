name: Apply Logo Layout Patch

on:
  push:
    paths:
      - '.github/workflows/apply-logo-layout-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Patch logo placement in index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old = ".game-main{display:flex;align-items:center;gap:8px;min-width:0}.game-main .text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}"
          new = ".game-main{display:flex;align-items:center;gap:8px;min-width:0}.game-main.logo-right{justify-content:space-between;width:100%;gap:10px}.game-main.logo-right .text{white-space:normal}.game-main .text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}"
          text = text.replace(old, new)

          old = ".game-chip{background:#eef4ff;color:#063a7d}.game-chip .team-logo{margin-right:3px}"
          new = ".game-chip{display:flex;align-items:center;justify-content:space-between;gap:4px;background:#eef4ff;color:#063a7d}.game-chip .chip-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.game-chip .team-logo{margin-left:4px;margin-right:0}"
          text = text.replace(old, new)

          old = "function gameLabelHtml(g,logoCls='team-logo sm'){const time=(g.game_time||'').slice(0,5);const mark=g.home_away==='AWAY'?'@':'vs';const score=g.status==='FINISHED'&&g.samsung_score!=null&&g.opponent_score!=null?` <span class=\"score\">${g.samsung_score}:${g.opponent_score}</span>`:'';return `<span class=\"game-main\">${teamLogo(g.opponent,logoCls)}<span class=\"text\">${time?`<b>${esc(time)}</b> `:''}${mark} <b>${esc(g.opponent)}</b>${score}</span></span>`}"
          new = old + "\nfunction gameLabelHtmlLogoRight(g,logoCls='team-logo sm'){const time=(g.game_time||'').slice(0,5);const mark=g.home_away==='AWAY'?'@':'vs';const score=g.status==='FINISHED'&&g.samsung_score!=null&&g.opponent_score!=null?` <span class=\"score\">${g.samsung_score}:${g.opponent_score}</span>`:'';return `<span class=\"game-main logo-right\"><span class=\"text\">${time?`<b>${esc(time)}</b> `:''}${mark} <b>${esc(g.opponent)}</b>${score}</span>${teamLogo(g.opponent,logoCls)}</span>`}\nfunction gameChipHtml(g){return `<span class=\"chip-text\">${esc(gameLabel(g))}</span>${teamLogo(g.opponent,'team-logo xs')}`}"
          if 'function gameLabelHtmlLogoRight' not in text:
              text = text.replace(old, new)

          text = text.replace("qs('mToday').innerHTML=tg?gameLabelHtml(tg,'team-logo sm'):'경기 없음';", "qs('mToday').innerHTML=tg?gameLabelHtmlLogoRight(tg,'team-logo sm'):'경기 없음';")
          text = text.replace("${teamLogo(g.opponent,'team-logo xs')}${esc(gameLabel(g))}", "${gameChipHtml(g)}")

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched index
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Adjust KBO logo placement in calendar"
          git push
