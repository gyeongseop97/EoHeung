name: Apply Link Clock Patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_link_clock_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Patch mobile drawer menu
        run: python scripts/apply_link_clock_patch.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-drawer-menu.js
          git commit -m "Add link clock card"
          git push
