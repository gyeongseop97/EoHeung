name: Update Naver game info

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-naver-game-info.yml"
      - "scripts/fetch-naver-game-info.js"
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: update-naver-game-info
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LINEUP_WINDOW_ONLY: '1'
      FORCE_LINEUP_REFRESH: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fetch-naver-game-info.js
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/today-game-info.json data/player-images
          git diff --cached --quiet || git commit -m "Update Naver game info cache"
          git push
