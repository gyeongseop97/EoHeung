name: Apply member privacy and readable UI once
on:
  push:
    branches: [member-privacy-readable-ui]
    paths: [.github/workflows/apply-member-ui-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: member-privacy-readable-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply verified source files with conflict checks
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          files=json.loads(gzip.decompress(base64.b64decode('')))
          root=Path.cwd().resolve()
          for item in files:
              path=(root/item['name']).resolve()
              if not path.is_relative_to(root) or '.git' in path.relative_to(root).parts:
                  raise RuntimeError('Unsafe source path')
              actual=path.read_bytes() if path.exists() else None
              if actual==item['content'].encode('utf-8'):
                  continue
              checksum=hashlib.sha256(actual).hexdigest() if actual is not None else None
              if checksum!=item['base']:
                  raise RuntimeError('Concurrent source edit: '+item['name'])
          for item in files:
              path=root/item['name']
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(item['content'],encoding='utf-8')
          print('Applied',len(files),'verified UI files')
          PY
      - name: Verify syntax and season behavior
        run: |
          node --check member-access.js
          node --check member-permission-control.js
          node --check mobile-drawer-menu.js
          node --check live-chat-widget.js
          node --check eoheung-member-logo-patch.js
          node --check my-records.js
          node --check my-records-share.js
          node --check my-records-details.js
          node --check settings-hub.js
          node --check my-records-model.js
          node --check kbo-record-utils.js
          node --check kbo-records-table-enhancement.js
          node --check kbo-records.js
          node --check kbo-season-center.js
          node --check kbo-recent-badges.js
          node --check attendance-permission-guard.js
          node --check game-result-auto-refresh.js
          node --test tests/member-access.test.cjs tests/kbo-season.test.cjs tests/records.test.cjs
          python -m unittest discover -s tests -p 'test_*.py'
          git diff --check
      - name: Commit complete UI update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'index.html' 'member-access.js' 'member-permission-control.js' 'mobile-drawer-menu.js' 'live-chat-widget.js' 'settings-hub.js' 'profile-settings.js' 'profile.js' 'eoheung-layout.css' 'eoheung-member-logo-patch.js' 'attendance-role-guard.js' 'supabase/sql/member_privacy.sql' 'supabase/sql/verify_member_privacy.sql' 'tests/member-access.test.cjs' 'README_SETUP.md'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Protect member contacts and improve readable navigation'
          git pull --rebase origin member-privacy-readable-ui
          git push origin HEAD:member-privacy-readable-ui
