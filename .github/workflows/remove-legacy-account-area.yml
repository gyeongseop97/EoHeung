name: Remove Legacy Account Area

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/remove_legacy_account_area.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Remove legacy account area
        run: python scripts/remove_legacy_account_area.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove legacy account area from topbar"
          git push
