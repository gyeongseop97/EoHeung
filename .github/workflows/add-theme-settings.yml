name: Add Theme Settings

on:
  push:
    paths:
      - '.github/workflows/add-theme-settings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Add theme selector and Excel theme
        run: |
          cat > /tmp/add_theme_patch.py <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          css_marker = '@media(max-width:1200px){.dashboard-grid{grid-template-columns:1fr}.app{grid-template-columns:1fr}'
          excel_css = '''
          body.theme-excel{background:#f3f6f4;color:#1f2937}
          body.theme-excel .sidebar{background:#217346;color:#fff;box-shadow:none;border-right:1px solid #185c37}
          body.theme-excel .logo{border-radius:3px;box-shadow:none;color:#217346}
          body.theme-excel .nav button{border-radius:2px;background:#2f8a57;color:#fff}
          body.theme-excel .nav button:hover,body.theme-excel .nav button.active{background:#fff;color:#217346;transform:none}
          body.theme-excel .syncbox{border-radius:2px;background:#2f8a57;border-color:#8cc7a4;color:#eefaf2}
          body.theme-excel .main{background:#f3f6f4}
          body.theme-excel .topbar h2{font-size:24px;color:#1f2937}
          body.theme-excel .card{border-radius:2px;box-shadow:none;background:#fff;border:1px solid #b7c9b7}
          body.theme-excel .card.pad{padding:16px}
          body.theme-excel .metric{padding:14px;background:#fff}
          body.theme-excel .metric .value{font-size:24px;color:#217346}
          body.theme-excel .btn{border-radius:2px;background:#217346;box-shadow:none;border:1px solid #185c37}
          body.theme-excel .btn.secondary{background:#fff;color:#217346;border:1px solid #7fb58d}
          body.theme-excel .btn.green{background:#e7f3ea;color:#185c37;border:1px solid #7fb58d}
          body.theme-excel .btn.danger{background:#fff;color:#b91c1c;border:1px solid #f2b8b5}
          body.theme-excel .input,body.theme-excel select,body.theme-excel textarea{border-radius:0;border:1px solid #9fb89f;box-shadow:none;background:#fff}
          body.theme-excel table{border-spacing:0;border-collapse:collapse;background:#fff}
          body.theme-excel th{background:#e2f0d9;color:#375623;border:1px solid #b7c9b7;padding:8px 10px;font-size:12px}
          body.theme-excel td{border:1px solid #d9ead3;border-radius:0!important;background:#fff;padding:8px 10px}
          body.theme-excel .mini-row,body.theme-excel .day,body.theme-excel .watch-item,body.theme-excel .empty{border-radius:2px;box-shadow:none;background:#fff;border:1px solid #b7c9b7}
          body.theme-excel .day.selected{border-color:#217346;box-shadow:inset 0 0 0 2px #217346}
          body.theme-excel .day.watch-attended{background:#e2f0d9;border-color:#70ad47}
          body.theme-excel .game-chip{border-radius:2px;background:#eef5ea;color:#185c37;border:1px solid #c6e0b4}
          body.theme-excel .watch-chip.attended{border-radius:2px;background:#d9ead3;color:#185c37}
          body.theme-excel .badge{border-radius:2px}
          body.theme-excel .modal{border-radius:2px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
          body.theme-excel .toolbar{gap:6px}
          .theme-setting-box{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:12px;align-items:center}.theme-preview{border:1px solid #b7c9b7;background:#fff;border-radius:2px;padding:10px;font-size:12px}.theme-preview .excel-ribbon{background:#217346;color:#fff;padding:6px 8px;font-weight:900;margin:-10px -10px 8px}.theme-preview table{width:100%;border-collapse:collapse}.theme-preview td{border:1px solid #d9ead3;padding:4px 6px}.theme-preview .head{background:#e2f0d9;font-weight:900;color:#375623}
          '''
          if 'body.theme-excel' not in text and css_marker in text:
              text = text.replace(css_marker, excel_css + '\n    ' + css_marker)

          settings_old = '<section id="settings" class="section"><div class="card pad"><h3>운영 메모</h3>'
          settings_new = '<section id="settings" class="section"><div class="card pad"><h3>테마 설정</h3><div class="theme-setting-box"><div><label class="note" for="themeSelect">화면 테마</label><select id="themeSelect" class="input" style="width:100%;margin-top:6px"><option value="default">기본 테마</option><option value="excel">엑셀 테마</option></select><p class="note" style="margin:8px 0 0">회사에서 볼 때 덜 튀도록 엑셀 느낌의 녹색/표 형식 UI로 바꿉니다. 선택값은 현재 브라우저에 저장됩니다.</p></div><div class="theme-preview"><div class="excel-ribbon">Excel Style</div><table><tr><td class="head">날짜</td><td class="head">경기</td><td class="head">상태</td></tr><tr><td>오늘</td><td>삼성 vs 상대팀</td><td>예정</td></tr></table></div></div></div><div class="card pad" style="margin-top:14px"><h3>운영 메모</h3>'
          if 'id="themeSelect"' not in text:
              text = text.replace(settings_old, settings_new)

          state_pattern = r"const state=\{client:null,user:null,members:\[\],games:\[\],gameMembers:\[\],links:\[\],allGames:\[\],page:'dashboard',year:new Date\(\)\.getFullYear\(\),month:new Date\(\)\.getMonth\(\)\+1,selectedDate:toYmd\(new Date\(\)\),weatherCache:\{\}\};"
          theme_js = "\nfunction getSavedTheme(){return localStorage.getItem('watchPartyTheme')||'default'}\nfunction applyTheme(theme){const t=theme||getSavedTheme();document.body.classList.toggle('theme-excel',t==='excel');localStorage.setItem('watchPartyTheme',t);const sel=document.getElementById('themeSelect');if(sel)sel.value=t}\n"
          if 'function applyTheme(theme)' not in text:
              text = re.sub(state_pattern, lambda m: m.group(0) + theme_js, text, count=1)

          if 'applyTheme(getSavedTheme());\nbindEvents();checkSession();' not in text:
              text = text.replace('bindEvents();checkSession();', 'applyTheme(getSavedTheme());\nbindEvents();checkSession();')

          if "const themeSel=qs('themeSelect')" not in text:
              text = text.replace("function bindEvents(){qs('signInBtn').onclick=async()=>", "function bindEvents(){const themeSel=qs('themeSelect');if(themeSel)themeSel.onchange=e=>applyTheme(e.target.value);qs('signInBtn').onclick=async()=>")

          if "applyTheme(getSavedTheme());renderWeatherForUpcoming" not in text:
              text = text.replace("renderYearMonth();renderDashboard();renderCalendar();renderWatchList();renderDateDetail();renderMembers();renderRecords();renderLinks();renderWeatherForUpcoming()", "renderYearMonth();renderDashboard();renderCalendar();renderWatchList();renderDateDetail();renderMembers();renderRecords();renderLinks();applyTheme(getSavedTheme());renderWeatherForUpcoming()")

          p.write_text(text, encoding='utf-8')
          PY
          python /tmp/add_theme_patch.py

      - name: Commit theme settings
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add selectable default and Excel themes"
          git push
