name: Apply verified season update once

on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-season-update-once.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed source files with conflict checks
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          files=json.loads(gzip.decompress(base64.b64decode('')))
          root=Path.cwd().resolve()
          for item in files:
              path=(root/item['name']).resolve()
              if not path.is_relative_to(root) or '.git' in path.relative_to(root).parts:
                  raise RuntimeError('Unsafe source path')
              desired=item['content'].encode('utf-8')
              actual=path.read_bytes() if path.exists() else None
              if actual==desired:
                  continue
              checksum=hashlib.sha256(actual).hexdigest() if actual is not None else None
              if checksum!=item['base']:
                  raise RuntimeError('Concurrent source edit: '+item['name'])
          for item in files:
              path=root/item['name']
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(item['content'],encoding='utf-8')
          print('Applied',len(files),'verified source files')
          PY
      - name: Verify season calculations and parsers
        run: |
          node --test tests/kbo-season.test.cjs
          python -m unittest discover -s tests -p 'test_*.py'
          git diff --check
      - name: Commit complete update and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'README_SETUP.md' 'game-result-auto-refresh.js' 'index.html' 'kbo-recent-badges.js' 'kbo-standings-fix.js' 'scripts/sync_kbo_schedule.py' 'supabase/functions/kbo-sync/index.ts' 'supabase_schema.sql' '.github/workflows/update-kbo-season.yml' '.gitignore' 'data/kbo-seasons/2025.json' 'data/kbo-seasons/2026.json' 'kbo-season-center.js' 'kbo-season.css' 'kbo-season.js' 'scripts/kbo_season.py' 'scripts/sync_kbo_season.py' 'supabase/sql/season_postseason.sql' 'tests/fixtures/season-2026.json' 'tests/kbo-season.test.cjs' 'tests/test_kbo_season.py'
          git rm -- .github/workflows/apply-season-update-once.yml
          git commit -m 'Add final season rankings and postseason schedules/results'
          git pull --rebase origin main
          git push origin HEAD:main
